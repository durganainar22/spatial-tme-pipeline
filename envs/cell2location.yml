# Reference signature estimation + spatial mapping (GPU).
# torch 2.7.1's default linux wheel is built for CUDA 12.6 and still supports
# V100 (sm_70); later CUDA 12.8+ builds drop Volta.
name: cell2location
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.7.1
      - cell2location==0.1.5
      - scvi-tools==1.3.3
      - pyro-ppl==1.9.1
      - scanpy==1.11.5
      - anndata==0.12.19
      - lightning==2.6.6
      - jax==0.6.2
      - numpy==2.4.6
      - pandas==2.3.3
