# QC, normalization, SVG detection, TME mapping, visualization (CPU only).
# Versions are the ones solved and tested together on linux-64.
name: spatial-tme
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy=1.12.4
  - squidpy=1.8.2
  - anndata=0.13.4
  - matplotlib=3.11.2
  - pandas=3.0.6
  - numpy=2.5.3
